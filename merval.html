<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Líderes · SilverCloud</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c0f;
    --surface: #111318;
    --surface2: #181c22;
    --border: #1e2530;
    --border2: #252d3a;
    --text: #e8edf5;
    --text2: #7a8799;
    --text3: #4a5568;
    --accent: #00d4aa;
    --accent2: #0099ff;
    --up: #00c47a;
    --down: #ff4757;
    --flat: #5a6a7e;
    --up-bg: rgba(0, 196, 122, 0.08);
    --down-bg: rgba(255, 71, 87, 0.08);
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.05em;
    text-decoration: none;
  }

  .logo span { color: var(--text2); font-weight: 400; }

  .header-right {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .status-dot {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text2);
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text3);
  }

  .dot.live { background: var(--up); animation: pulse 2s infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .btn-refresh {
    font-family: var(--mono);
    font-size: 11px;
    padding: 6px 14px;
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--text2);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.05em;
  }

  .btn-refresh:hover { border-color: var(--accent); color: var(--accent); }
  .btn-refresh:disabled { opacity: 0.4; cursor: not-allowed; }

  /* MAIN */
  main { padding: 28px 32px; }

  /* PAGE TITLE */
  .page-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .page-title {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    color: var(--text2);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .page-subtitle {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text3);
  }

  /* SUMMARY CARDS */
  .summary-row {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }

  .summary-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 16px;
  }

  .summary-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text3);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .summary-value {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
  }

  .summary-value.up { color: var(--up); }
  .summary-value.down { color: var(--down); }

  /* TABLE */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--mono);
    font-size: 12px;
  }

  thead th {
    padding: 10px 14px;
    text-align: right;
    font-size: 10px;
    font-weight: 500;
    color: var(--text3);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    transition: color 0.15s;
  }

  thead th:hover { color: var(--text2); }
  thead th:first-child { text-align: left; padding-left: 20px; }
  thead th.sorted { color: var(--accent); }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
    cursor: default;
  }

  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--surface2); }

  tbody td {
    padding: 11px 14px;
    text-align: right;
    color: var(--text);
    white-space: nowrap;
  }

  tbody td:first-child {
    text-align: left;
    padding-left: 20px;
  }

  .ticker {
    font-weight: 600;
    font-size: 13px;
    color: var(--text);
  }

  .ticker-desc {
    font-size: 10px;
    color: var(--text3);
    font-family: var(--sans);
    margin-top: 1px;
    font-weight: 300;
    max-width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .price {
    font-weight: 600;
    font-size: 13px;
  }

  .var-badge {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 3px 8px;
    border-radius: 3px;
    font-size: 11px;
    font-weight: 500;
    min-width: 68px;
    justify-content: center;
  }

  .var-badge.up { background: var(--up-bg); color: var(--up); }
  .var-badge.down { background: var(--down-bg); color: var(--down); }
  .var-badge.flat { color: var(--flat); }

  .muted { color: var(--text2); }
  .muted-strong { color: var(--text3); }

  /* SKELETON */
  .skeleton {
    background: linear-gradient(90deg, var(--surface2) 25%, var(--border) 50%, var(--surface2) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: 3px;
    height: 12px;
    display: inline-block;
  }

  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* ERROR */
  .error-msg {
    text-align: center;
    padding: 60px 20px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--down);
  }

  /* LAST UPDATE */
  .footer-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    background: var(--bg);
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text3);
  }

  @media (max-width: 900px) {
    main { padding: 16px; }
    header { padding: 12px 16px; }
    .summary-row { grid-template-columns: repeat(2, 1fr); }
    .hide-mobile { display: none; }
  }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo">SILVER<span>CLOUD</span></a>
  <div class="header-right">
    <div class="status-dot">
      <div class="dot" id="statusDot"></div>
      <span id="statusText">—</span>
    </div>
    <button class="btn-refresh" id="btnRefresh" onclick="cargarPanel()">↺ Actualizar</button>
  </div>
</header>

<main>
  <div class="page-header">
    <div>
      <div class="page-title">Panel Líderes · BYMA</div>
    </div>
    <div class="page-subtitle" id="lastUpdate">—</div>
  </div>

  <div class="summary-row" id="summaryRow">
    <div class="summary-card"><div class="summary-label">Subiendo</div><div class="summary-value" id="sumUp">—</div></div>
    <div class="summary-card"><div class="summary-label">Bajando</div><div class="summary-value" id="sumDown">—</div></div>
    <div class="summary-card"><div class="summary-label">Mayor suba</div><div class="summary-value up" id="sumBest">—</div></div>
    <div class="summary-card"><div class="summary-label">Mayor baja</div><div class="summary-value down" id="sumWorst">—</div></div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th onclick="sortBy('simbolo')">Símbolo</th>
          <th onclick="sortBy('ultimoPrecio')">Último</th>
          <th onclick="sortBy('variacion')" class="sorted">Var %</th>
          <th class="hide-mobile" onclick="sortBy('precioCompra')">Compra</th>
          <th class="hide-mobile" onclick="sortBy('precioVenta')">Venta</th>
          <th class="hide-mobile" onclick="sortBy('apertura')">Apertura</th>
          <th class="hide-mobile" onclick="sortBy('minimo')">Mínimo</th>
          <th class="hide-mobile" onclick="sortBy('maximo')">Máximo</th>
          <th class="hide-mobile" onclick="sortBy('cierreAnterior')">Cierre ant.</th>
          <th onclick="sortBy('montoOperado')">Monto op.</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="10" style="text-align:center; padding:50px; color:#4a5568; font-family:var(--mono); font-size:12px;">Cargando datos...</td></tr>
      </tbody>
    </table>
    <div class="footer-bar">
      <span>BYMA · Tiempo real IOL</span>
      <span id="footerCount">—</span>
    </div>
  </div>
</main>

<script>
const PROXY = 'https://silvercloud1.vercel.app/api/iol';

const TICKERS = [
  'ALUA','BBAR','BMA','BYMA','CEPU','COME','CRES',
  'EDN','GGAL','IRSA','LOMA','MIRG','PAMP','SUPV',
  'TECO2','TGNO4','TGSU2','TRAN','TXAR','VALO','VIST','YPF'
];

const NOMBRES = {
  ALUA:'Aluar', BBAR:'BBVA Argentina', BMA:'Banco Macro', BYMA:'Bolsas y Mercados',
  CEPU:'Central Puerto', COME:'Comercial del Plata', CRES:'Cresud',
  EDN:'Edenor', GGAL:'Grupo Galicia', IRSA:'IRSA', LOMA:'Loma Negra',
  MIRG:'Mirgor', PAMP:'Pampa Energía', SUPV:'Supervielle',
  TECO2:'Telecom', TGNO4:'TGN', TGSU2:'TGS', TRAN:'Transener',
  TXAR:'Ternium Argentina', VALO:'Banco de Valores', VIST:'Vista Energy', YPF:'YPF'
};

let datos = [];
let sortCol = 'variacion';
let sortDir = -1;

function fmt(n, dec=2) {
  if (n == null || isNaN(n)) return '—';
  return n.toLocaleString('es-AR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}

function fmtM(n) {
  if (n == null || isNaN(n)) return '—';
  if (n >= 1e9) return (n/1e9).toFixed(1) + 'B';
  if (n >= 1e6) return (n/1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(0) + 'K';
  return n.toFixed(0);
}

function varClass(v) {
  if (v > 0) return 'up';
  if (v < 0) return 'down';
  return 'flat';
}

function varSign(v) {
  if (v > 0) return '▲';
  if (v < 0) return '▼';
  return '—';
}

function renderTabla() {
  const sorted = [...datos].sort((a, b) => {
    const va = a[sortCol] ?? 0;
    const vb = b[sortCol] ?? 0;
    if (typeof va === 'string') return sortDir * va.localeCompare(vb);
    return sortDir * (va - vb);
  });

  const up = datos.filter(d => d.variacion > 0).length;
  const down = datos.filter(d => d.variacion < 0).length;
  const sorted2 = [...datos].sort((a,b) => b.variacion - a.variacion);
  const best = sorted2[0];
  const worst = sorted2[sorted2.length-1];

  document.getElementById('sumUp').textContent = up;
  document.getElementById('sumDown').textContent = down;
  document.getElementById('sumBest').textContent = best ? best.simbolo + ' ' + (best.variacion > 0 ? '+' : '') + fmt(best.variacion) + '%' : '—';
  document.getElementById('sumWorst').textContent = worst ? worst.simbolo + ' ' + fmt(worst.variacion) + '%' : '—';
  document.getElementById('footerCount').textContent = datos.length + ' instrumentos';

  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = sorted.map(d => {
    const vc = varClass(d.variacion);
    const vs = varSign(d.variacion);
    return `
      <tr>
        <td>
          <div class="ticker">${d.simbolo}</div>
          <div class="ticker-desc">${NOMBRES[d.simbolo] || ''}</div>
        </td>
        <td><span class="price ${vc}">${fmt(d.ultimoPrecio)}</span></td>
        <td><span class="var-badge ${vc}">${vs} ${Math.abs(d.variacion).toFixed(2)}%</span></td>
        <td class="hide-mobile muted">${fmt(d.precioCompra)}</td>
        <td class="hide-mobile muted">${fmt(d.precioVenta)}</td>
        <td class="hide-mobile muted-strong">${fmt(d.apertura)}</td>
        <td class="hide-mobile muted-strong">${fmt(d.minimo)}</td>
        <td class="hide-mobile muted-strong">${fmt(d.maximo)}</td>
        <td class="hide-mobile muted-strong">${fmt(d.cierreAnterior)}</td>
        <td class="muted">${fmtM(d.montoOperado)}</td>
      </tr>`;
  }).join('');

  document.querySelectorAll('thead th').forEach(th => th.classList.remove('sorted'));
}

function sortBy(col) {
  if (sortCol === col) { sortDir *= -1; }
  else { sortCol = col; sortDir = col === 'variacion' ? -1 : -1; }
  renderTabla();
}

async function cargarPanel() {
  const btn = document.getElementById('btnRefresh');
  const dot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  btn.disabled = true;
  dot.className = 'dot';
  statusText.textContent = 'Cargando...';

  try {
    const results = await Promise.all(TICKERS.map(async ticker => {
      try {
        const res = await fetch(`${PROXY}?action=cotizacion&simbolo=${ticker}&mercado=bCBA`);
        const d = await res.json();
        if (d.parseError || d.error) return null;

        const puntas = d.puntas || [];
        const compra = puntas[0]?.precioCompra ?? null;
        const venta = puntas[0]?.precioVenta ?? null;

        return {
          simbolo: ticker,
          ultimoPrecio: d.ultimoPrecio,
          variacion: d.variacion,
          precioCompra: compra,
          precioVenta: venta,
          apertura: d.apertura,
          minimo: d.minimo,
          maximo: d.maximo,
          cierreAnterior: d.cierreAnterior,
          montoOperado: d.montoOperado,
        };
      } catch(e) { return null; }
    }));

    datos = results.filter(Boolean);

    if (datos.length === 0) throw new Error('Sin datos');

    renderTabla();

    const now = new Date();
    const h = now.getHours().toString().padStart(2,'0');
    const m = now.getMinutes().toString().padStart(2,'0');
    const s = now.getSeconds().toString().padStart(2,'0');
    document.getElementById('lastUpdate').textContent = `Actualizado ${h}:${m}:${s}`;
    dot.className = 'dot live';
    statusText.textContent = 'En vivo · IOL';

  } catch(e) {
    document.getElementById('tableBody').innerHTML = `<tr><td colspan="10" class="error-msg">Error: ${e.message}</td></tr>`;
    dot.className = 'dot';
    statusText.textContent = 'Error';
  }

  btn.disabled = false;
}

cargarPanel();
setInterval(cargarPanel, 60000);
</script>
</body>
</html>
